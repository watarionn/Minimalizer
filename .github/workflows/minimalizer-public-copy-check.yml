name: Minimalizer Public Japanese UI copy

on:
  pull_request:
    paths:
      - "web/static/index.html"
      - "web/static/styles.css"
      - "tests/test_public_page_plain_japanese.py"
      - ".github/workflows/minimalizer-public-copy-check.yml"

permissions:
  contents: read

jobs:
  public-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Japanese page copy and Local isolation
        run: |
          python -m pip install pytest
          python -m pytest tests/test_public_page_plain_japanese.py tests/test_minimalizer_page_split.py -q
      - name: Build isolated Public static assets
        run: python scripts/build_shin_static.py
      - name: Verify built page has no advertising hero
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("dist/shin/index.html").read_text(encoding="utf-8")
          assert "画像を、必要なかたちだけに。" not in html
          assert '<h1 class="public-page__title">画像簡略化ツール</h1>' in html
          assert 'id="file-input"' in html
          assert (Path("dist/shin/static") / "styles.css").is_file()
          assert not (Path("dist/shin/static") / "local-route.js").exists()
          print("Public static output and Private Local isolation: PASS")
          PY
      - name: No accidental whitespace errors
        run: git diff --check origin/main...HEAD
