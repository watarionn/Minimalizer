name: Browser Sharp Lite v13

on:
  pull_request:
    paths:
      - "web/static/app.js"
      - "web/static/browser-fallback.js"
      - "tests/test_browser_sharp_lite_v13.py"
      - ".github/workflows/browser-sharp-lite-v13.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sharp-lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install focused test dependencies
        run: python -m pip install pytest
      - name: JavaScript syntax
        run: |
          node --check web/static/app.js
          node --check web/static/browser-fallback.js
          node --check web/static/canonical-contour.js
          node --check web/static/opencv-fill-raster.js
      - name: Sharp Lite contract and palette guard
        run: python -m pytest tests/test_browser_sharp_lite_v13.py -q
      - name: Diff whitespace check
        run: git diff --check HEAD~1 HEAD
