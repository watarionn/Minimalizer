name: Minimalizer Browser Resource Hygiene

on:
  push:
    branches: [main]
    paths:
      - "tools/minimalizer_browser_profile_lifecycle.py"
      - "tools/cleanup_minimalizer_orphan_chrome.py"
      - "tools/run_browser_facet_v15_chrome_compare.py"
      - "tools/run_browser_shape_v14_chrome_compare.py"
      - "tools/run_browser_sharp_lite_chrome_compare.py"
      - "tests/test_minimalizer_browser_resource_hygiene.py"
      - ".github/workflows/minimalizer-browser-resource-hygiene.yml"
  pull_request:
    paths:
      - "tools/minimalizer_browser_profile_lifecycle.py"
      - "tools/cleanup_minimalizer_orphan_chrome.py"
      - "tools/run_browser_facet_v15_chrome_compare.py"
      - "tools/run_browser_shape_v14_chrome_compare.py"
      - "tools/run_browser_sharp_lite_chrome_compare.py"
      - "tests/test_minimalizer_browser_resource_hygiene.py"
      - ".github/workflows/minimalizer-browser-resource-hygiene.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-resident-browser-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight tests only
        run: python -m pip install pytest
      - name: Static syntax checks without launching browsers
        run: |
          python -m py_compile \
            tools/minimalizer_browser_profile_lifecycle.py \
            tools/cleanup_minimalizer_orphan_chrome.py \
            tools/run_browser_facet_v15_chrome_compare.py \
            tools/run_browser_shape_v14_chrome_compare.py \
            tools/run_browser_sharp_lite_chrome_compare.py
      - name: Fail-closed synthetic process-ownership tests
        run: python -m pytest -q tests/test_minimalizer_browser_resource_hygiene.py
