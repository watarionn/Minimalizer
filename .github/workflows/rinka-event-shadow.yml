name: rinka-event-shadow
on:
  pull_request:
    paths:
      - "minimalizer_zerobase/golden_comparison/events.py"
      - "minimalizer_zerobase/golden_comparison/shadow.py"
      - "minimalizer_zerobase/golden_comparison/event_hub_client.py"
      - "minimalizer_zerobase/golden_comparison/runtime.py"
      - "tests/zerobase/test_golden_events.py"
      - "tests/zerobase/test_golden_shadow.py"
      - "tests/zerobase/test_event_hub_client.py"
      - "tests/zerobase/test_golden_runtime.py"
      - ".github/workflows/rinka-event-shadow.yml"
  push:
    branches: [main]
    paths:
      - "minimalizer_zerobase/golden_comparison/**"
      - "tests/zerobase/test_golden_*.py"
      - "tests/zerobase/test_event_hub_client.py"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/zerobase/test_golden_events.py tests/zerobase/test_golden_shadow.py tests/zerobase/test_event_hub_client.py tests/zerobase/test_golden_runtime.py -q
