name: Browser Color Groups v25 Research
on:
  pull_request:
    paths:
      - "web/static/browser-color-groups-v25.js"
      - "web/static/browser-fallback.js"
      - "web/static/app.js"
      - "web/static/index.html"
      - "tests/test_browser_color_groups_v25.py"
      - "tools/run_browser_groups_v25_chrome.py"
      - "tools/analyze_browser_groups_v25.py"
      - ".github/workflows/browser-groups-v25.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  group-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Verify script syntax
        run: |
          node --check web/static/browser-color-groups-v25.js
          node --check web/static/browser-fallback.js
          node --check web/static/app.js
          python -m py_compile tests/test_browser_color_groups_v25.py tools/run_browser_groups_v25_chrome.py tools/analyze_browser_groups_v25.py
      - name: V25 and inherited quality-gate regressions
        run: |
          python -m pytest tests/test_browser_color_groups_v25.py tests/test_browser_color_region_v24.py tests/test_browser_plane_v23.py tests/test_browser_auto_gated_v22.py tests/test_browser_targeted_v21.py tests/test_browser_donor_distribution_v20.py tests/test_browser_merge_diagnostic_v19.py tests/test_browser_near_v18.py tests/test_browser_selective_v17.py tests/test_browser_facet_v15.py tests/test_browser_shape_v14.py tests/test_browser_sharp_lite_v13.py -q
      - name: Check diff whitespace
        run: git diff --check origin/research/browser-color-region-v24-20261009...HEAD
