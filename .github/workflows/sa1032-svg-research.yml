name: SA10 SVG research validation
on:
  push:
    branches:
      - research/sa1032-svg-contour-proposals
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install numpy opencv-python-headless pillow pytest
      - name: Focused source contour regression
        run: python -m pytest -q tests/zerobase/test_sa1032_source_svg_contour_proposals.py tests/zerobase/test_sa1032_svg_evidence.py tests/zerobase/test_sa1032_gc001_mask_compare.py tests/zerobase/test_sa1032_gc001_owner_audit.py tests/zerobase/test_sa1032_source_contour_optimizer.py tests/zerobase/test_sa1032_gc001_real_contour_eval.py tests/zerobase/test_sa1033_phase7_geometry_authority.py tests/zerobase/test_sa1033_crosscase_gate.py tests/zerobase/test_sa1034_exact_vector_replay.py
      - name: Compile package
        run: python -m compileall -q minimalizer_zerobase tools/run_sa1032_gc001_owner_audit.py tools/run_sa1032_gc001_real_contour_eval.py tools/run_sa1033_gc001_full_gate.py tools/run_sa1033_crosscase_gate.py tools/run_sa1034_phase8_exact_replay.py
      - name: Whitespace validation
        run: git diff --check HEAD~1 HEAD
