name: Browser Shape v14

on:
  pull_request:
    paths:
      - "web/static/canonical-contour.js"
      - "web/static/browser-fallback.js"
      - "web/static/app.js"
      - "tests/test_browser_shape_v14.py"
      - "tools/run_browser_shape_v14_chrome_compare.py"
      - ".github/workflows/browser-shape-v14.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shape-v14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install lightweight test tools
        run: python -m pip install pytest
      - name: Verify JavaScript and benchmark syntax
        run: |
          node --check web/static/canonical-contour.js
          node --check web/static/browser-fallback.js
          node --check web/static/app.js
          python -m py_compile tools/run_browser_shape_v14_chrome_compare.py
      - name: Verify geometry, palette and fail-closed gates
        run: |
          python -m pytest tests/test_browser_shape_v14.py tests/test_browser_sharp_lite_v13.py -q
      - name: Check stacked PR diff
        run: git diff --check origin/feat/browser-sharp-lite-v13-20261008...HEAD
