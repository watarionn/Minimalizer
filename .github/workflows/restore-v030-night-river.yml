name: Restore v0.3.0 Night River

on:
  push:
    branches:
      - restore/v0.3.0-stable-source-20260907
    paths:
      - '.bootstrap/night-river/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest restoration branch
        uses: actions/checkout@v4
        with:
          ref: restore/v0.3.0-stable-source-20260907
          fetch-depth: 0

      - name: Reconstruct verified original Night River
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .bootstrap/night-river/part00
            cat .bootstrap/night-river/fix/part01_0
            cat .bootstrap/night-river/fix/part01_1
            cat .bootstrap/night-river/part02
            cat .bootstrap/night-river/part03
            cat .bootstrap/night-river/part04
            cat .bootstrap/night-river/part05
            cat .bootstrap/night-river/fix/part06_00
            cat .bootstrap/night-river/fix/part06_01
            cat .bootstrap/night-river/fix/part06_1
            cat .bootstrap/night-river/part07
            cat .bootstrap/night-river/part08
            cat .bootstrap/night-river/part09
            cat .bootstrap/night-river/part10
          } > /tmp/night-river.b64

          test "$(wc -c < /tmp/night-river.b64)" -eq 169176
          base64 --decode /tmp/night-river.b64 > /tmp/night-river.webp
          test "$(wc -c < /tmp/night-river.webp)" -eq 126880
          echo 'f244e86e02c90753ab575e0f95b5c872527afe0a63bb3c314b77a84c6ef81a66  /tmp/night-river.webp' | sha256sum --check --strict

          mkdir -p tests/assets/corpus examples
          cp /tmp/night-river.webp tests/assets/corpus/Night-River-City_general.webp
          cp /tmp/night-river.webp examples/input.webp

      - name: Verify complete stable corpus and source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('.')
          corpus = root / 'tests/assets/corpus'
          manifest = json.loads((root / 'tests/assets/corpus_manifest.json').read_text(encoding='utf-8'))
          assert len(manifest) == 16, len(manifest)
          missing = [item['name'] for item in manifest if not (corpus / item['name']).is_file()]
          assert not missing, missing
          image_files = [p for p in corpus.iterdir() if p.suffix.lower() in {'.png', '.webp'}]
          assert len(image_files) == 16, len(image_files)

          expected = 'f244e86e02c90753ab575e0f95b5c872527afe0a63bb3c314b77a84c6ef81a66'
          for path in [corpus / 'Night-River-City_general.webp', root / 'examples/input.webp']:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == expected, (path, digest)

          tests = list((root / 'tests').glob('test_*.py'))
          assert len(tests) == 39, len(tests)
          print('corpus=16/16 tests=39 NightRiverSHA=OK')
          PY
          python -m compileall -q minimalize_engine app gui tools tests

      - name: Commit clean restored snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .bootstrap/night-river
          git rm .github/workflows/restore-v030-night-river.yml
          git add tests/assets/corpus/Night-River-City_general.webp examples/input.webp
          git commit -m 'restore: complete v0.3.0 stable corpus snapshot'
          git push origin HEAD:restore/v0.3.0-stable-source-20260907
