name: Browser Donor Distribution v20

on:
  pull_request:
    paths:
      - "web/static/browser-fallback.js"
      - "web/static/app.js"
      - "tests/test_browser_donor_distribution_v20.py"
      - "tools/run_browser_donor_v20_chrome.py"
      - "tools/analyze_browser_donor_v20.py"
      - "tools/package_browser_donor_v20_evidence.py"
      - ".github/workflows/browser-donor-v20.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test runner
        run: python -m pip install pytest
      - name: Verify research tooling syntax
        run: |
          node --check web/static/browser-fallback.js
          node --check web/static/app.js
          python -m py_compile tools/run_browser_donor_v20_chrome.py tools/analyze_browser_donor_v20.py tools/package_browser_donor_v20_evidence.py
      - name: Verify noninterfering donor probe and previous modes
        run: |
          python -m pytest tests/test_browser_donor_distribution_v20.py tests/test_browser_merge_diagnostic_v19.py tests/test_browser_near_v18.py tests/test_browser_selective_v17.py tests/test_browser_facet_v15.py tests/test_browser_shape_v14.py tests/test_browser_sharp_lite_v13.py -q
      - name: Check stacked research diff
        run: git diff --check origin/research/browser-merge-diagnostic-v19-20261008...HEAD
