          curl -L --fail --retry 3 --retry-delay 2 -o "tests/assets/corpus/Koganei-Niko_pr-img_01_a.png" "https://hololive.hololivepro.com/wp-content/uploads/2023/09/Koganei-Niko_pr-img_01_a.png"
