          curl -L --fail --retry 3 --retry-delay 2 -o "tests/assets/corpus/Mizumiya-Su_pr-img_01_a.png" "https://hololive.hololivepro.com/wp-content/uploads/2023/09/Mizumiya-Su_pr-img_01_a.png"
          echo "1769f635405c57192206aac42e162ae6a29b94cf2cb0936ceab34f8d0454a813  tests/assets/corpus/Mizumiya-Su_pr-img_01_a.png" | sha256sum -c -
          curl -L --fail --retry 3 --retry-delay 2 -o "tests/assets/corpus/Rindo-Chihaya_pr-img_01_a.png" "https://hololive.hololivepro.com/wp-content/uploads/2023/09/Rindo-Chihaya_pr-img_01_a.png"
