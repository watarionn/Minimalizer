          echo "5bd5a54acabfc79525c875db2e4790484120770e845f52e93a31fcea77ff1f65  tests/assets/corpus/Juufuutei-Raden_pr-img_01_a.webp" | sha256sum -c -

      - name: Commit verified official corpus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/assets/corpus
          git rm .github/workflows/restore-v030-official-corpus.yml
          git commit -m "restore: add verified official v0.3.0 corpus images"
          git push origin HEAD:restore/v0.3.0-stable-source-20260907
