          curl -L --fail --retry 3 --retry-delay 2 -o "tests/assets/corpus/Todoroki-Hajime_pr-img_01_a.png" "https://hololive.hololivepro.com/wp-content/uploads/2023/09/Todoroki-Hajime_pr-img_01_a.png"
          echo "40b40d5f83819128036b9f990b3ee772f4e26ef94a2d4458a9fbd398d46ddffd  tests/assets/corpus/Todoroki-Hajime_pr-img_01_a.png" | sha256sum -c -
          curl -L --fail --retry 3 --retry-delay 2 -o "tests/assets/corpus/Kikirara-Vivi_pr-img_01_a.webp" "https://hololive.hololivepro.com/wp-content/uploads/2023/09/Kikirara-Vivi_pr-img_01_a.webp"
