name: Restore v0.3.0 official corpus

on:
  push:
    branches:
      - restore/v0.3.0-stable-source-20260907
    paths:
      - .github/workflows/restore-v030-official-corpus.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore/v0.3.0-stable-source-20260907
          fetch-depth: 0

      - name: Download and verify official corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/assets/corpus
          curl -L --fail --retry 3 --retry-delay 2 -o "tests/assets/corpus/Elizabeth-Rose-Bloodflame_pr-img_01.webp" "https://hololive.hololivepro.com/wp-content/uploads/2023/07/Elizabeth-Rose-Bloodflame_pr-img_01.webp"
          echo "9937145b7fd56ecebaf1ff3bbd7ba1273f2122f8bcf04a345e46ce3d998a437f  tests/assets/corpus/Elizabeth-Rose-Bloodflame_pr-img_01.webp" | sha256sum -c -
          curl -L --fail --retry 3 --retry-delay 2 -o "tests/assets/corpus/Ichijou-Ririka_pr-img_01_a.webp" "https://hololive.hololivepro.com/wp-content/uploads/2023/09/Ichijou-Ririka_pr-img_01_a.webp"
          echo "efac8dcc0076d952966f64a3f2943ec7c13fa9e7ca339f90359235b6a5585d13  tests/assets/corpus/Ichijou-Ririka_pr-img_01_a.webp" | sha256sum -c -
          curl -L --fail --retry 3 --retry-delay 2 -o "tests/assets/corpus/Isaki-Riona_pr-img_01_a.png" "https://hololive.hololivepro.com/wp-content/uploads/2023/09/Isaki-Riona_pr-img_01_a.png"
