name: SA8 HOLD validation
on:
  pull_request:
    branches: [main]
jobs:
  hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt scikit-image
      - name: Focused SA8
        run: >-
          python -m pytest -q
          tests/zerobase/test_sa8_palette_role_adapter.py
          tests/zerobase/test_semantic_abstraction_palette_role_subdivision.py
          tests/zerobase/test_sa8_palette_role_candidates.py
          tests/zerobase/test_graph_macro_renderer.py
          tests/zerobase/test_semantic_abstraction_render_guard.py
          tests/zerobase/test_semantic_layer_authority.py
          tests/zerobase/test_face_mass_exclusion.py
      - name: Full ZeroBase
        run: python -m pytest tests/zerobase -q
      - name: Compile
        run: python -m compileall -q minimalizer_zerobase
