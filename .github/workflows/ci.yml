name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: minimalizer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stable-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web-test.txt

      - name: Compile source tree
        run: python -m compileall -q minimalize_engine app gui tools tests web

      - name: Run stable smoke regressions
        run: |
          python -m pytest -q \
            tests/test_config.py \
            tests/test_global_shape_cleanup.py \
            tests/test_adaptive_polygon_simplify.py \
            tests/test_high_resolution_guard.py \
            tests/test_target_style.py \
            tests/test_target_hierarchy.py \
            tests/test_v020_bundle.py::test_corpus_manifest_contains_uploaded_images

      - name: Run Web API and UI tests
        run: python -m pytest -q tests/test_web_api.py tests/test_color_strip.py

      - name: Run real-server Web smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn web.app:app --host 127.0.0.1 --port 8000 >/tmp/minimalizer-uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8000/ | grep -q 'id="drop-zone"'
          curl --fail --silent http://127.0.0.1:8000/api/info \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d["web_version"] == "0.8.0"; assert d["supported_modes"] == ["standard", "rinka_reference", "color_strip"]; assert d["rinka_reference_version"] == "phase7"; assert d["color_strip_version"] == "v0.3"; assert d["color_strip_default_selection_mode"] == "dominant"; assert d["color_strip_selection_modes"] == ["dominant", "featured"]; assert d["color_strip_default_size_mode"] == "equal"; assert d["color_strip_default_order"] == "least_first"; assert d["color_strip_default_orientation"] == "vertical"; assert d["engine_version"] == "0.3.0"; assert d["max_analysis_side"] == 640; assert d["max_concurrent_jobs"] == 2'

          python - <<'PY'
          import cv2
          major = int(cv2.__version__.split('.', 1)[0])
          assert major < 5, cv2.__version__
          print(f"OpenCV {cv2.__version__}")
          PY

          curl --fail --silent \
            -D /tmp/minimalizer-headers.txt \
            -o /tmp/minimalized.svg \
            -F 'file=@examples/input.webp;type=image/webp' \
            -F 'mode=standard' \
            -F 'level=4' \
            -F 'output_format=svg' \
            http://127.0.0.1:8000/api/minimalize

          grep -qi '^x-request-id:' /tmp/minimalizer-headers.txt
          grep -qi '^x-minimalizer-processing-ms:' /tmp/minimalizer-headers.txt
          grep -qi '^x-minimalizer-mode: standard' /tmp/minimalizer-headers.txt
          grep -qi '^x-minimalizer-source-format: WEBP' /tmp/minimalizer-headers.txt
          grep -q '^<svg' /tmp/minimalized.svg

          curl --fail --silent \
            -D /tmp/minimalizer-rinka-headers.txt \
            -o /tmp/minimalized-rinka.svg \
            -F 'file=@examples/input.webp;type=image/webp' \
            -F 'mode=rinka_reference' \
            -F 'level=4' \
            -F 'output_format=svg' \
            http://127.0.0.1:8000/api/minimalize

          grep -qi '^x-minimalizer-mode: rinka_reference' /tmp/minimalizer-rinka-headers.txt
          grep -q '^<svg' /tmp/minimalized-rinka.svg

          curl --fail --silent \
            -D /tmp/minimalizer-color-strip-headers.txt \
            -o /tmp/color-strip.svg \
            -F 'file=@examples/input.webp;type=image/webp' \
            -F 'mode=color_strip' \
            -F 'colors=5' \
            -F 'color_similarity=18' \
            -F 'color_selection_mode=featured' \
            -F 'color_size_mode=proportional' \
            -F 'color_order=most_first' \
            -F 'color_orientation=horizontal' \
            -F 'output_format=svg' \
            http://127.0.0.1:8000/api/minimalize

          grep -qi '^x-minimalizer-mode: color_strip' /tmp/minimalizer-color-strip-headers.txt
          grep -qi '^x-minimalizer-color-count:' /tmp/minimalizer-color-strip-headers.txt
          grep -qi '^x-minimalizer-color-selection-mode: featured' /tmp/minimalizer-color-strip-headers.txt
          grep -qi '^x-minimalizer-color-size-mode: proportional' /tmp/minimalizer-color-strip-headers.txt
          grep -qi '^x-minimalizer-color-order: most_first' /tmp/minimalizer-color-strip-headers.txt
          grep -qi '^x-minimalizer-color-orientation: horizontal' /tmp/minimalizer-color-strip-headers.txt
          grep -q '^<svg' /tmp/color-strip.svg
          grep -q '<rect ' /tmp/color-strip.svg

  rinka-target-eval:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web-test.txt

      - name: Evaluate Rinka Phase 7 corpus
        run: |
          python tools/evaluate_rinka_target.py \
            --level 4 \
            --max-side 220 \
            --output-dir /tmp/rinka-target-phase7
          echo '--- Rinka Phase 7 summary ---'
          cat /tmp/rinka-target-phase7/summary_0_end.json

      - name: Enforce Phase 7 safety guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('/tmp/rinka-target-phase7/summary_0_end.json').read_text())
          assert summary['target_style_version'] == 'phase7', summary
          assert summary['mean_shape_reduction_ratio'] >= 0.382, summary
          assert summary['worst_target_pre_identity_delta'] >= -0.08, summary
          assert summary['worst_target_pre_silhouette_delta'] >= -0.01, summary
          assert summary['global_scoring_enabled_count'] == summary['count'], summary
          assert summary['total_target_cleanup_removed_global_thin'] == 3, summary
          assert summary['total_target_global_low_value_thin_candidates'] >= 11, summary
          assert summary['total_target_global_low_value_subject_count'] == 0, summary
          assert summary['opaque_hierarchy_enabled_count'] >= 1, summary
          assert summary['total_opaque_subject_shapes'] >= 1, summary
          assert summary['opaque_zones_enabled_count'] >= 1, summary
          assert summary['subject_zones_enabled_count'] >= 12, summary
          assert summary['structure_zones_enabled_count'] >= 10, summary
          assert summary['total_target_structure_redundant_removed'] == 2, summary
          assert summary['total_target_outfit_layer_merges'] == 3, summary
          assert summary['total_target_render_inert_occluded_removed'] == 2, summary
          assert summary['total_target_gesture_simplified_shapes'] == 4, summary
          assert summary['total_target_gesture_vertices_removed'] == 8, summary
          assert summary['total_target_gesture_anchored_simplifications'] == 1, summary
          assert summary['total_target_gesture_hand_anchors'] >= 10, summary
          assert summary['mean_vertex_reduction_ratio'] >= 0.315, summary
          assert summary['total_target_cap_removed'] == 0, summary
          assert summary['total_target_macro_shadow_would_remove'] == 1, summary
          assert summary['total_target_macro_shadow_would_remove_background'] == 0, summary
          assert summary['total_target_macro_shadow_would_remove_subject'] == 1, summary
          assert summary['total_target_macro_shadow_subject_continuity'] == 1, summary
          assert summary['total_target_macro_shadow_inside_subject_bbox'] == 1, summary
          assert summary['macro_shadow_blocked_count'] == 1, summary
          assert summary['macro_shadow_continuity_blocked_count'] == 1, summary
          assert summary['total_opaque_zone_shapes'] >= 1, summary
          assert summary['total_opaque_head_shapes'] >= 1, summary
          assert summary['total_opaque_torso_shapes'] >= 1, summary
          assert summary['opaque_face_reference_count'] >= 1, summary
          assert summary['total_opaque_inferred_hair_shapes'] >= 1, summary
          assert summary['total_opaque_inferred_clothing_shapes'] >= 1, summary
          print('Phase 7 safety guard passed')
          PY

      - name: Upload Rinka Phase 7 evaluation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rinka-target-phase7-evaluation
          path: /tmp/rinka-target-phase7
          if-no-files-found: warn
          retention-days: 14
