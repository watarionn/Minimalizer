name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  stable-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless Pillow pytest

      - name: Compile source tree
        run: python -m compileall -q minimalize_engine app gui tools tests

      - name: Run stable smoke regressions
        run: |
          python -m pytest -q \
            tests/test_config.py \
            tests/test_global_shape_cleanup.py \
            tests/test_adaptive_polygon_simplify.py \
            tests/test_high_resolution_guard.py \
            tests/test_v020_bundle.py::test_corpus_manifest_contains_uploaded_images
