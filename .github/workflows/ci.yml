name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: minimalizer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stable-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web-test.txt

      - name: Compile source tree
        run: python -m compileall -q minimalize_engine app gui tools tests web

      - name: Run stable smoke regressions
        run: |
          python -m pytest -q \
            tests/test_config.py \
            tests/test_global_shape_cleanup.py \
            tests/test_adaptive_polygon_simplify.py \
            tests/test_high_resolution_guard.py \
            tests/test_target_style.py \
            tests/test_v020_bundle.py::test_corpus_manifest_contains_uploaded_images

      - name: Run Web API and UI tests
        run: python -m pytest -q tests/test_web_api.py

      - name: Run real-server Web smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn web.app:app --host 127.0.0.1 --port 8000 >/tmp/minimalizer-uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8000/ | grep -q 'id="drop-zone"'
          curl --fail --silent http://127.0.0.1:8000/api/info \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d["web_version"] == "0.4.1"; assert d["engine_version"] == "0.3.0"; assert d["max_analysis_side"] == 640; assert d["max_concurrent_jobs"] == 2'

          python - <<'PY'
          import cv2
          major = int(cv2.__version__.split('.', 1)[0])
          assert major < 5, cv2.__version__
          print(f"OpenCV {cv2.__version__}")
          PY

          curl --fail --silent \
            -D /tmp/minimalizer-headers.txt \
            -o /tmp/minimalized.svg \
            -F 'file=@examples/input.webp;type=image/webp' \
            -F 'level=4' \
            -F 'output_format=svg' \
            http://127.0.0.1:8000/api/minimalize

          grep -qi '^x-request-id:' /tmp/minimalizer-headers.txt
          grep -qi '^x-minimalizer-processing-ms:' /tmp/minimalizer-headers.txt
          grep -qi '^x-minimalizer-source-format: WEBP' /tmp/minimalizer-headers.txt
          grep -q '^<svg' /tmp/minimalized.svg

  rinka-target-eval:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/rinka-target-phase1-cleanup-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web-test.txt

      - name: Evaluate Phase 2 baseline
        run: |
          python tools/evaluate_rinka_target.py \
            --level 4 \
            --max-side 220 \
            --output-dir /tmp/rinka-ab/phase2
          echo '--- Rinka Phase 2 baseline ---'
          cat /tmp/rinka-ab/phase2/summary_0_end.json

      - name: Evaluate identity-safe candidate
        run: |
          python tools/evaluate_rinka_target.py \
            --level 4 \
            --max-side 220 \
            --target-palette 6 \
            --target-epsilon 0.032 \
            --output-dir /tmp/rinka-ab/identity-safe
          echo '--- Rinka identity-safe candidate ---'
          cat /tmp/rinka-ab/identity-safe/summary_0_end.json

      - name: Compare A/B summaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/rinka-ab')
          baseline = json.loads((root/'phase2'/'summary_0_end.json').read_text())
          safe = json.loads((root/'identity-safe'/'summary_0_end.json').read_text())
          keys = [
              'mean_shape_reduction_ratio',
              'mean_vertex_reduction_ratio',
              'mean_target_pre_identity_delta',
              'worst_target_pre_identity_delta',
              'mean_target_pre_silhouette_delta',
              'worst_target_pre_silhouette_delta',
          ]
          comparison = {
              key: {
                  'phase2': baseline.get(key),
                  'identity_safe': safe.get(key),
                  'delta': None if baseline.get(key) is None or safe.get(key) is None else safe[key] - baseline[key],
              }
              for key in keys
          }
          out = root/'ab_comparison.json'
          out.write_text(json.dumps(comparison, indent=2), encoding='utf-8')
          print(json.dumps(comparison, indent=2))
          PY

      - name: Upload Rinka A/B evaluation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rinka-target-phase2-identity-safe-ab
          path: /tmp/rinka-ab
          if-no-files-found: warn
          retention-days: 14
