name: Browser Merge v19 Research

on:
  pull_request:
    paths:
      - "web/static/browser-fallback.js"
      - "web/static/app.js"
      - "tests/test_browser_merge_diagnostic_v19.py"
      - ".github/workflows/browser-merge-v19.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Browser script syntax
        run: |
          node --check web/static/browser-fallback.js
          node --check web/static/app.js
          python -m py_compile tools/run_browser_near_v18_chrome_compare.py
      - name: Renderer rollback and inherited contracts
        run: python -m pytest tests/test_browser_merge_diagnostic_v19.py tests/test_browser_near_v18.py tests/test_browser_selective_v17.py tests/test_browser_facet_v15.py tests/test_browser_shape_v14.py tests/test_browser_sharp_lite_v13.py -q
      - name: Whitespace
        run: git diff --check origin/research/browser-near-color-v18-20261008...HEAD
