name: Browser Near v18 Research

on:
  pull_request:
    paths:
      - "web/static/browser-fallback.js"
      - "web/static/app.js"
      - "tests/test_browser_near_v18.py"
      - "tests/test_browser_selective_v17.py"
      - "tests/test_browser_facet_v15.py"
      - "tests/test_browser_sharp_lite_v13.py"
      - "tools/run_browser_near_v18_chrome_compare.py"
      - ".github/workflows/browser-near-v18.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  near:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test runner
        run: python -m pip install pytest
      - name: Validate syntax
        run: |
          node --check web/static/browser-fallback.js
          node --check web/static/app.js
          python -m py_compile tools/run_browser_near_v18_chrome_compare.py
      - name: Near, selective, and earlier quality contracts
        run: python -m pytest tests/test_browser_near_v18.py tests/test_browser_selective_v17.py tests/test_browser_facet_v15.py tests/test_browser_shape_v14.py tests/test_browser_sharp_lite_v13.py -q
      - name: Diff hygiene
        run: git diff --check origin/feat/browser-selective-merge-v17-20261008...HEAD
