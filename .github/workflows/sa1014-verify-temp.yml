name: sa1014-verify-temp
on:
  pull_request:
    paths:
      - "minimalizer_zerobase/evaluation/regression_transaction.py"
      - "tools/run_sa1014_regression_transaction.py"
      - "tests/zerobase/test_sa1014_*.py"
      - "benchmarks/regression/sa10/transactions/**"
      - "benchmarks/regression/sa10/SA10_14_transaction_set.json"
      - ".github/workflows/sa1014-verify-temp.yml"
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy opencv-python-headless Pillow pytest
      - run: >-
          python -m pytest
          tests/zerobase/test_sa1014_regression_transaction.py
          tests/zerobase/test_sa1014_real_transactions.py
          tests/zerobase/test_sa1013_forbidden_face_repair.py
          tests/zerobase/test_sa1012_visual_hard_gate_backfill.py
          tests/zerobase/test_sa1011_structural_hard_fail_repair.py
          tests/zerobase/test_sa735_canonical_hard_gate.py
          -q
