name: Browser Facet v15

on:
  pull_request:
    paths:
      - "web/static/canonical-contour.js"
      - "web/static/browser-fallback.js"
      - "web/static/app.js"
      - "tests/test_browser_facet_v15.py"
      - "tests/test_browser_shape_v14.py"
      - "tests/test_browser_sharp_lite_v13.py"
      - "tools/run_browser_facet_v15_chrome_compare.py"
      - ".github/workflows/browser-facet-v15.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-facet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Validate JS and replay harness syntax
        run: |
          node --check web/static/canonical-contour.js
          node --check web/static/browser-fallback.js
          node --check web/static/app.js
          python -m py_compile tools/run_browser_facet_v15_chrome_compare.py
      - name: Guard Facet geometry and earlier modes
        run: python -m pytest tests/test_browser_facet_v15.py tests/test_browser_shape_v14.py tests/test_browser_sharp_lite_v13.py -q
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
