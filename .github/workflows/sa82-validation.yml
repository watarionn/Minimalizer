name: SA8.2 validation
on: {pull_request: {branches: [main]}}
jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: "3.12"}
   - run: python -m pip install -r requirements.txt scikit-image
   - run: python -m pytest -q tests/zerobase/test_sa82_downstream_compatible_overlay.py tests/zerobase/test_sa8_palette_role_candidates.py tests/zerobase/test_graph_macro_renderer.py tests/zerobase/test_semantic_layer_authority.py
   - run: python -m pytest tests/zerobase -q
   - run: python -m compileall -q minimalizer_zerobase
