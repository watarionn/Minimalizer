name: Browser Single Pair v21 Research

on:
  pull_request:
    paths:
      - "web/static/browser-fallback.js"
      - "tests/test_browser_targeted_v21.py"
      - "tools/run_browser_targeted_v21_chrome.py"
      - "tools/analyze_browser_targeted_v21.py"
      - ".github/workflows/browser-single-pair-v21.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-single-pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tests
        run: python -m pip install pytest
      - name: Syntax
        run: |
          node --check web/static/browser-fallback.js
          node --check web/static/app.js
          python -m py_compile tools/run_browser_targeted_v21_chrome.py tools/analyze_browser_targeted_v21.py
      - name: Guard targeted same-color merge, raster protection and past modes
        run: |
          python -m pytest tests/test_browser_targeted_v21.py tests/test_browser_donor_distribution_v20.py tests/test_browser_merge_diagnostic_v19.py tests/test_browser_near_v18.py tests/test_browser_selective_v17.py tests/test_browser_facet_v15.py tests/test_browser_shape_v14.py tests/test_browser_sharp_lite_v13.py -q
      - name: Diff hygiene
        run: git diff --check origin/research/browser-donor-distribution-v20-20261008...HEAD
