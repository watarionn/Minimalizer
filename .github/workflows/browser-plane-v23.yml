name: Browser Major Plane v23 Research

on:
  pull_request:
    paths:
      - "web/static/canonical-contour.js"
      - "web/static/browser-fallback.js"
      - "web/static/app.js"
      - "tests/test_browser_plane_v23.py"
      - "tools/run_browser_plane_v23_chrome.py"
      - "tools/analyze_browser_plane_v23.py"
      - "tools/package_browser_plane_v23.py"
      - ".github/workflows/browser-plane-v23.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plane-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Syntax
        run: |
          node --check web/static/canonical-contour.js
          node --check web/static/browser-fallback.js
          node --check web/static/app.js
          python -m py_compile tools/run_browser_plane_v23_chrome.py tools/analyze_browser_plane_v23.py tools/package_browser_plane_v23.py
      - name: Geometry and inherited color safety tests
        run: |
          python -m pytest tests/test_browser_plane_v23.py tests/test_browser_auto_gated_v22.py tests/test_browser_targeted_v21.py tests/test_browser_donor_distribution_v20.py tests/test_browser_merge_diagnostic_v19.py tests/test_browser_near_v18.py tests/test_browser_selective_v17.py tests/test_browser_facet_v15.py tests/test_browser_shape_v14.py tests/test_browser_sharp_lite_v13.py -q
      - name: Diff hygiene
        run: git diff --check origin/research/browser-auto-gated-v22-20261008...HEAD
