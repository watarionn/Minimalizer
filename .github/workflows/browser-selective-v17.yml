name: Browser Selective v17

on:
  pull_request:
    paths:
      - "web/static/browser-fallback.js"
      - "web/static/app.js"
      - "tests/test_browser_selective_v17.py"
      - "tests/test_browser_facet_v15.py"
      - "tests/test_browser_sharp_lite_v13.py"
      - "tools/run_browser_selective_v17_chrome_compare.py"
      - ".github/workflows/browser-selective-v17.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selective:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Syntax
        run: |
          node --check web/static/app.js
          node --check web/static/browser-fallback.js
          python -m py_compile tools/run_browser_selective_v17_chrome_compare.py
      - name: Guard selective merge and preceding modes
        run: python -m pytest tests/test_browser_selective_v17.py tests/test_browser_facet_v15.py tests/test_browser_shape_v14.py tests/test_browser_sharp_lite_v13.py -q
      - name: Diff whitespace
        run: git diff --check origin/main...HEAD
